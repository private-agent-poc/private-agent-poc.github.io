<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://*.phala.network; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Private Agent</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main id="login" class="login">
  <div class="login-card">
    <div class="brand"><span class="brand-mark">▍</span>PA<span class="dim">//</span>TEE</div>
    <h1>Private Agent</h1>
    <p class="lede mono">Intel TDX · Remote Attestation · E2EE</p>
    <form id="login-form" class="login-form" autocomplete="off">
      <label class="field">
        <span class="field-label mono">Endpoint</span>
        <input id="cvm-url" class="mono" type="url" required spellcheck="false">
      </label>
      <label class="field">
        <span class="field-label mono">Key</span>
        <input id="access-key" type="password" required spellcheck="false">
      </label>
      <button id="login-btn" class="btn primary" type="submit">登录</button>
    </form>
    <ol id="login-log" class="term mono" aria-live="polite"></ol>
  </div>
</main>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand small"><span class="brand-mark">▍</span>PA<span class="dim">//</span>TEE</div>
    <div class="target mono" id="target"></div>
    <div class="topbar-right">
      <span class="chip mono" id="session-chip"></span>
      <button class="btn ghost small" id="logout-btn" type="button">退出</button>
    </div>
  </header>
  <div class="columns">
    <section class="chat" aria-label="Chat">
      <div class="col-head"><span class="col-kicker mono">CHAT</span></div>
      <ol id="thread" class="thread"></ol>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="msg" rows="2" maxlength="2000" placeholder="输入消息"></textarea>
        <div class="composer-row">
          <label class="toggle">
            <input type="checkbox" id="simulate">
            <span class="switch" aria-hidden="true"></span>
            <span>模拟源码篡改</span>
          </label>
          <button id="send-btn" class="btn primary" type="submit">发送</button>
        </div>
      </form>
    </section>
    <section class="panel" aria-label="Verification" id="panel"></section>
  </div>
</div>
</body>
</html>
